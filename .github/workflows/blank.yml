name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        qt_ver:
          - 6.7.*
          - 6.8.*
          - 6.9.*
          - 6.10.*
          - 6.11.*
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: pzhlkj6612/forked-install-qt-action
          ref: 9d29cb7c1a03d1b2bf69dd2bdff2b469855e0757

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: action/

      - run: |
          cd action
          npm ci || npm install
        shell: bash
      - run: |
          cd action
          npm run build
      # See the root "action.yml" file.
      - name: Use local built internal action (hack)
        run: |
          sed -i.bak 's|uses: $/action|uses: ./action|' action.yml
          diff -u action.yml.bak action.yml || true
          git status --porcelain
        shell: bash

      - uses: ./
        with:
          version: ${{ matrix.qt_ver }}
          target: wasm
          host: all_os
          arch: wasm_singlethread
